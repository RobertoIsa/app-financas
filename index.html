<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="tela-login" aria-labelledby="login-titulo">
      <h1 id="login-titulo">Controle Financeiro</h1>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" name="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" name="senha" autocomplete="current-password" required>
        </div>
        <p id="login-erro" class="erro" role="alert" aria-live="assertive"></p>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <section id="tela-app" hidden aria-labelledby="app-titulo">
      <header class="app-header">
        <h1 id="app-titulo">Controle Financeiro</h1>
        <div class="usuario">
          <span id="usuario-email"></span>
          <button id="btn-sair" type="button">Sair</button>
        </div>
      </header>

      <p id="app-erro" class="erro" role="alert" aria-live="assertive"></p>

      <nav class="app-nav" aria-label="Navegação principal">
        <button type="button" class="nav-botao" data-tela="lancamento" aria-current="page">Lançar</button>
        <button type="button" class="nav-botao" data-tela="cartoes">Cartões</button>
      </nav>

      <div id="tela-lancamento">
      <section aria-labelledby="lancamento-titulo">
        <h2 id="lancamento-titulo">Novo lançamento</h2>
        <form id="form-lancamento" novalidate>
          <div class="campo">
            <span id="tipo-label">Tipo</span>
            <div class="toggle-grupo" role="radiogroup" aria-labelledby="tipo-label">
              <label class="toggle-opcao">
                <input type="radio" name="tipo" value="despesa" checked>
                <span>Despesa</span>
              </label>
              <label class="toggle-opcao">
                <input type="radio" name="tipo" value="receita">
                <span>Receita</span>
              </label>
            </div>
          </div>

          <div class="campo">
            <label for="lanc-valor">Valor (R$)</label>
            <input type="text" id="lanc-valor" inputmode="decimal" placeholder="0,00" autocomplete="off" required>
          </div>

          <div class="campo">
            <label for="lanc-categoria">Categoria</label>
            <select id="lanc-categoria" required></select>
          </div>

          <div class="campo">
            <label for="lanc-descricao">Descrição</label>
            <input type="text" id="lanc-descricao" placeholder="Ex.: iFood" autocomplete="off">
          </div>

          <div class="campo">
            <label for="lanc-meio">Meio de pagamento</label>
            <select id="lanc-meio" required>
              <option value="dinheiro">Dinheiro</option>
              <option value="debito">Débito</option>
              <option value="pix">Pix</option>
              <option value="transferencia">Transferência</option>
              <option value="credito">Crédito</option>
            </select>
          </div>

          <div class="campo" id="grupo-cartao" hidden>
            <label for="lanc-cartao">Cartão</label>
            <select id="lanc-cartao"></select>
            <p id="cartao-aviso" class="aviso" role="status" aria-live="polite" hidden>
              Cadastre um cartão antes de lançar no crédito.
              <button type="button" id="btn-ir-cartoes" class="link-botao">Cadastrar cartão</button>
            </p>
          </div>

          <div class="campo" id="grupo-parcelas" hidden>
            <label for="lanc-parcelas">Número de parcelas</label>
            <input type="number" id="lanc-parcelas" min="1" max="60" step="1" value="1" inputmode="numeric">
          </div>

          <div class="campo">
            <label for="lanc-responsavel">Responsável</label>
            <select id="lanc-responsavel" required></select>
          </div>

          <div class="campo">
            <label for="lanc-data">Data</label>
            <input type="date" id="lanc-data" required>
          </div>

          <p id="lancamento-erro" class="erro" role="alert" aria-live="assertive"></p>
          <p id="lancamento-sucesso" class="sucesso" role="status" aria-live="polite"></p>

          <button type="submit">Salvar lançamento</button>
        </form>
      </section>

      <section aria-labelledby="mes-titulo">
        <h2 id="mes-titulo">Lançamentos do mês</h2>
        <p id="mes-status" role="status" aria-live="polite"></p>
        <ul id="lista-lancamentos"></ul>
      </section>
      </div>

      <div id="tela-cartoes" hidden>
        <section aria-labelledby="cartao-form-titulo">
          <h2 id="cartao-form-titulo">Cartões</h2>
          <form id="form-cartao" novalidate>
            <div class="campo">
              <label for="cartao-nome">Nome</label>
              <input type="text" id="cartao-nome" placeholder="Ex.: LATAM" autocomplete="off" required>
            </div>

            <div class="campo">
              <label for="cartao-fechamento">Dia de fechamento</label>
              <input type="number" id="cartao-fechamento" min="1" max="31" step="1" inputmode="numeric" required>
            </div>

            <div class="campo">
              <label for="cartao-vencimento">Dia de vencimento</label>
              <input type="number" id="cartao-vencimento" min="1" max="31" step="1" inputmode="numeric" required>
            </div>

            <div class="campo">
              <label for="cartao-titular">Titular</label>
              <select id="cartao-titular" required></select>
            </div>

            <p id="cartao-form-erro" class="erro" role="alert" aria-live="assertive"></p>
            <p id="cartao-form-sucesso" class="sucesso" role="status" aria-live="polite"></p>

            <div class="form-acoes">
              <button type="submit" id="btn-salvar-cartao">Salvar cartão</button>
              <button type="button" id="btn-cancelar-edicao-cartao" hidden>Cancelar edição</button>
            </div>
          </form>
        </section>

        <section aria-labelledby="cartao-lista-titulo">
          <h2 id="cartao-lista-titulo">Cartões cadastrados</h2>
          <p id="cartoes-status" role="status" aria-live="polite"></p>
          <ul id="lista-cartoes"></ul>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
